name: Validate Eway Sandbox

permissions:
  contents: write

on:
  push:
    branches:
      - eway-sandbox
      - stripe-sandbox
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
      - name: Commit updated Bun lockfile
        run: |
          if git diff --quiet bun.lock; then
            echo "bun.lock is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Update Bun lockfile for Stripe dependencies"
          git push

      - name: Build project
        run: bun run build
